<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7.13. 수업량 유연화 프로그램 학생 배정 현황</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

  :root {
    --navy: #0d1b35;
    --navy2: #162347;
    --blue: #1e40af;
    --sky: #3b82f6;
    --accent: #f59e0b;
    --accent2: #fbbf24;
    --green: #059669;
    --red: #dc2626;
    --bg: #f0f4fb;
    --card: #ffffff;
    --text: #1e293b;
    --sub: #64748b;
    --border: #e2e8f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  .header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 50%, #1a3a6e 100%);
    color: #fff;
    padding: 28px 24px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 70% 50%, rgba(59,130,246,0.18) 0%, transparent 60%);
  }
  .header-badge {
    display: inline-block;
    background: var(--accent);
    color: var(--navy);
    font-size: 11px; font-weight: 700;
    padding: 3px 10px; border-radius: 20px;
    margin-bottom: 10px; letter-spacing: 0.05em;
  }
  .header h1 {
    font-size: clamp(15px, 4vw, 20px);
    font-weight: 700; line-height: 1.45;
    position: relative;
  }
  .header h1 span { color: var(--accent2); }
  .header-sub {
    margin-top: 8px; font-size: 13px; opacity: 0.7;
    position: relative;
  }

  /* ── 검색 섹션 ── */
  .search-section {
    background: var(--card);
    padding: 20px 16px;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .search-wrap {
    max-width: 600px; margin: 0 auto;
  }
  .search-label {
    font-size: 12px; font-weight: 600; color: var(--sub);
    margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .search-row {
    display: flex; gap: 8px;
  }
  .search-input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--sky); }
  .search-btn {
    padding: 12px 20px;
    background: var(--blue);
    color: #fff;
    border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .search-btn:hover { background: var(--sky); }
  .search-hint {
    margin-top: 7px; font-size: 11.5px; color: var(--sub);
  }

  /* ── 강의실 아이콘 그리드 ── */
  .room-section {
    background: var(--card);
    padding: 16px 16px 20px;
    border-bottom: 3px solid var(--border);
  }
  .room-title {
    font-size: 12px; font-weight: 600; color: var(--sub);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 12px; max-width: 600px; margin-left: auto; margin-right: auto;
  }
  .room-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    max-width: 600px; margin: 0 auto;
  }
  .room-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 4px 8px;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
    transition: all 0.18s;
    gap: 4px;
  }
  .room-btn:hover {
    border-color: var(--sky); background: #eff6ff;
    transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.15);
  }
  .room-btn.active {
    border-color: var(--blue); background: #dbeafe;
  }
  .room-icon { font-size: 20px; }
  .room-label {
    font-size: 11px; font-weight: 600; color: var(--text);
  }
  .room-grade {
    font-size: 9px; color: var(--sub);
  }

  /* ── 결과 영역 ── */
  .result-section {
    padding: 16px;
    max-width: 700px; margin: 0 auto;
  }
  .result-placeholder {
    text-align: center; padding: 40px 20px;
    color: var(--sub);
  }
  .result-placeholder .big-icon { font-size: 48px; margin-bottom: 12px; }
  .result-placeholder p { font-size: 14px; line-height: 1.6; }

  /* 개인 결과 */
  .student-result {}
  .student-header {
    background: linear-gradient(135deg, var(--navy), var(--blue));
    color: #fff; border-radius: 12px;
    padding: 16px 18px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 12px;
  }
  .student-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .student-info h2 { font-size: 17px; font-weight: 700; }
  .student-info p { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .grade-badge {
    margin-left: auto; flex-shrink: 0;
    background: var(--accent); color: var(--navy);
    font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
  }

  .assignment-card {
    background: var(--card); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
    border-left: 4px solid var(--sky);
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex; align-items: center; gap: 12px;
  }
  .assignment-card.pm { border-left-color: var(--green); }
  .asgn-time {
    font-size: 11px; font-weight: 700; color: var(--sky);
    background: #eff6ff; padding: 3px 8px; border-radius: 6px;
    white-space: nowrap; flex-shrink: 0;
  }
  .assignment-card.pm .asgn-time { color: var(--green); background: #d1fae5; }
  .asgn-body { flex: 1; min-width: 0; }
  .asgn-course { font-size: 13px; font-weight: 600; }
  .asgn-room {
    font-size: 12px; color: var(--sub); margin-top: 2px;
    display: flex; align-items: center; gap: 4px;
  }

  /* 강좌/강의실 결과 */
  .course-result-header {
    background: var(--card); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px;
    border: 2px solid var(--sky);
    display: flex; align-items: center; gap: 10px;
  }
  .course-result-header.pm { border-color: var(--green); }
  .course-icon { font-size: 28px; }
  .course-title { font-size: 15px; font-weight: 700; }
  .course-meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .course-room-badge {
    margin-left: auto; flex-shrink: 0;
    background: var(--sky); color: #fff;
    font-size: 12px; font-weight: 700;
    padding: 5px 12px; border-radius: 8px;
  }
  .course-result-header.pm .course-room-badge { background: var(--green); }

  /* 명단 카드 */
  .list-card {
    background: var(--card); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .list-card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .list-card-title { font-size: 13px; font-weight: 700; }
  .list-card-room {
    font-size: 12px; color: var(--sub);
    display: flex; align-items: center; gap: 4px;
  }
  .list-card-count {
    font-size: 11px; font-weight: 600;
    background: var(--bg); color: var(--sub);
    padding: 2px 8px; border-radius: 10px;
  }
  .student-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 6px;
  }
  .student-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 8px; border-radius: 7px;
    background: var(--bg); font-size: 12px;
  }
  .student-chip .chip-grade {
    font-size: 9px; font-weight: 700;
    width: 16px; height: 16px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: var(--sky); color: #fff;
  }
  .student-chip .chip-grade.g2 { background: var(--green); }
  .student-chip .chip-grade.g3 { background: var(--accent); color: var(--navy); }
  .chip-id { font-size: 10px; color: var(--sub); }
  .chip-name { font-weight: 500; }

  /* 섹션 구분자 */
  .section-divider {
    display: flex; align-items: center; gap: 10px;
    margin: 16px 0 10px;
    font-size: 12px; font-weight: 700; color: var(--sub);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  /* 오류 메시지 */
  .not-found {
    text-align: center; padding: 30px 20px;
    background: var(--card); border-radius: 12px;
  }
  .not-found .icon { font-size: 36px; margin-bottom: 10px; }
  .not-found p { font-size: 14px; color: var(--sub); }

  /* 로딩 스피너 */
  .loading {
    text-align: center; padding: 30px; color: var(--sub);
    font-size: 14px;
  }

  @media (max-width: 400px) {
    .room-grid { grid-template-columns: repeat(4, 1fr); }
    .student-grid { grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); }
  }
</style>
</head>

<div class="header">

  <h1>2026. 1학기 <span>김해임호고</span><br>수업량유연화 <span>7.13.(월)</span> 프로그램<br>학생 배정 현황</h1>

</div>

const roomGrid = document.getElementById('roomGrid');
ROOMS.forEach(room => {

  const icons = {'1': '🏫', '2': '🏛️', '3': '🎓'};
  const icon = icons[room[0]] || '🏫';
  const btn = document.createElement('button');
  btn.className = 'room-btn';
  btn.innerHTML = `<span class="room-icon">${icon}</span><span class="room-label">${room}</span><span class="room-grade">${grade}</span>`;

  btn.dataset.room = room;
  roomGrid.appendChild(btn);
});

function highlightRoom(btn) {
  document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── 메인 검색 ──
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));

  // 학번 (4자리 숫자)
  if (/^\d{4}$/.test(q)) { showStudentResult(q); return; }
  // 이름 검색 (2자 이상 한글)
  if (/^[가-힣]{2,}$/.test(q)) {
    const found = findStudentByName(q);
    if (found) { showStudentResult(found); return; }
  }
  // 강의실
  if (ROOMS.includes(q)) { searchByRoom(q); return; }

  const amMatch = AM_COURSES.find(c => c.includes(q) || q.includes(c.replace(/[AB]반$/,'')));
  if (amMatch) { searchByCourse(amMatch, 'am'); return; }

  const pmMatch = PM_COURSES.find(c => c.includes(q));
  if (pmMatch) { searchByCourse(pmMatch, 'pm'); return; }
  // 부분 이름 검색
  const found2 = findStudentByNamePartial(q);
  if (found2) { showStudentResult(found2); return; }

  showNotFound(q);
}

function findStudentByName(name) {
  for (const sess of Object.values(DATA)) {
    for (const c of sess.courses) {
      for (const s of c.students) {
        if (s.name === name) return s.id;
      }
    }
  }
  return null;
}

function findStudentByNamePartial(q) {
  for (const sess of Object.values(DATA)) {
    for (const c of sess.courses) {
      for (const s of c.students) {
        if (s.name && s.name.includes(q)) return s.id;
      }
    }
  }
  return null;
}

// ── 학생 개인 결과 ──
function showStudentResult(sid) {
  const assignments = [];
  let studentName = '', studentGrade = 0;
  for (const [snum, sess] of Object.entries(DATA)) {
    for (const c of sess.courses) {
      const stu = c.students.find(s => s.id === sid);
      if (stu) {
        studentName = stu.name; studentGrade = stu.grade;
        assignments.push({
          sessNum: parseInt(snum), label: sess.label, ampm: sess.ampm,
          course: c.course, classroom: c.classroom
        });
      }
    }
  }

  if (!assignments.length) { showNotFound(sid); return; }

  const gradeEmoji = ['','🟦','🟩','🟨'][studentGrade] || '⬜';
  const gradeLabel = studentGrade + '학년';

  let html = `
    <div class="student-result">
      <div class="student-header">
        <div class="student-avatar">👤</div>
        <div class="student-info">
          <h2>${studentName || '(이름 없음)'} <span style="font-weight:400;font-size:14px;opacity:0.8">${sid}</span></h2>
          <p>${gradeEmoji} ${gradeLabel}</p>
        </div>
        <div class="grade-badge">${gradeLabel}</div>
      </div>`;

  // 오전
  const amItems = assignments.filter(a => a.ampm === '오전');
  if (amItems.length) {
    html += `<div class="section-divider">☀️ 오전 강좌</div>`;
    amItems.forEach(a => {
      html += `<div class="assignment-card">
        <div class="asgn-time">${a.label}</div>
        <div class="asgn-body">
          <div class="asgn-course">${a.course}</div>
          <div class="asgn-room">🏫 ${a.classroom}</div>
        </div>
      </div>`;
    });
  }

  // 오후
  const pmItems = assignments.filter(a => a.ampm === '오후');
  if (pmItems.length) {
    html += `<div class="section-divider">🌤️ 오후 강좌</div>`;
    pmItems.forEach(a => {
      html += `<div class="assignment-card pm">
        <div class="asgn-time">${a.label}</div>
        <div class="asgn-body">
          <div class="asgn-course">${a.course}</div>
          <div class="asgn-room">🏫 ${a.classroom}</div>
        </div>
      </div>`;
    });
  }

  if (!pmItems.length && studentGrade === 3) {
    html += `<div class="section-divider">🌤️ 오후 강좌</div>
      <div class="assignment-card pm" style="opacity:0.5">
        <div class="asgn-time" style="color:#9ca3af;background:#f3f4f6">3·4강</div>
        <div class="asgn-body"><div class="asgn-course" style="color:#9ca3af">3학년 — 오후 강좌 미배정</div></div>
      </div>`;
  }

  html += `</div>`;
  setResult(html);
}

// ── 강좌 결과 ──
function searchByCourse(courseName, ampm) {
  const sessions = ampm === 'am' ? ['1','2'] : ['3','4'];
  const label = ampm === 'am' ? '오전 강좌' : '오후 강좌';
  const icon = ampm === 'am' ? '☀️' : '🌤️';
  const ispm = ampm === 'pm';

  let html = `<div class="section-divider">${icon} ${label} — ${courseName}</div>`;

  for (const snum of sessions) {
    const sess = DATA[snum];
    const course = sess.courses.find(c => c.course === courseName);
    if (!course) continue;

    html += `
      <div class="course-result-header ${ispm?'pm':''}">
        <div class="course-icon">${icon}</div>
        <div>
          <div class="course-title">${sess.label}</div>
          <div class="course-meta">${course.course} · ${course.students.length}명</div>
        </div>
        <div class="course-room-badge">🏫 ${course.classroom}</div>
      </div>
      <div class="list-card">
        <div class="student-grid">
          ${course.students.map(s => chipHTML(s)).join('')}
        </div>
      </div>`;
  }
  setResult(html);
}

// ── 강의실 결과 ──
function searchByRoom(room) {
  document.getElementById('searchInput').value = room;
  let html = `<div class="section-divider">🏫 강의실 ${room} — 전체 명단</div>`;
  let found = false;

  const sessionOrder = [['1','☀️','오전 1강 (1,2교시)',''],['2','☀️','오전 2강 (3,4교시)',''],
                        ['3','🌤️','오후 3강 (5교시)','pm'],['4','🌤️','오후 4강 (6교시)','pm']];

  for (const [snum, icon, label, pm] of sessionOrder) {
    const sess = DATA[snum];
    const course = sess.courses.find(c => c.classroom === room);
    if (!course) continue;
    found = true;
    html += `
      <div class="list-card">
        <div class="list-card-header">
          <div>
            <div class="list-card-title">${icon} ${label}</div>
            <div class="list-card-room">📚 ${course.course}</div>
          </div>
          <div class="list-card-count">${course.students.length}명</div>
        </div>
        <div class="student-grid">
          ${course.students.map(s => chipHTML(s)).join('')}
        </div>
      </div>`;
  }

  if (!found) html += `<div class="not-found"><div class="icon">🏫</div><p>${room} 강의실 배정 정보가 없습니다.</p></div>`;
  setResult(html);
}

function chipHTML(s) {
  const gc = ['','g1','g2','g3'][s.grade] || '';
  return `<div class="student-chip">
    <span class="chip-grade ${gc}">${s.grade}</span>
    <div><div class="chip-name">${s.name}</div><div class="chip-id">${s.id}</div></div>
  </div>`;
}

function showNotFound(q) {
  setResult(`<div class="not-found"><div class="icon">🔍</div><p>"${q}"에 대한 배정 정보를 찾을 수 없습니다.<br><span style="font-size:12px">학번·이름·강좌명·강의실을 확인해 주세요.</span></p></div>`);
}

function setResult(html) {
  document.getElementById('resultSection').innerHTML = html;
  document.getElementById('resultSection').scrollIntoView({behavior:'smooth', block:'start'});
}
</script>
</body>
</html>
