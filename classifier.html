<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이미지 분류기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f8f6; color: #1a1a18; min-height: 100vh; }
  .container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 2rem; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; align-items: start; }
  @media(max-width:600px){ .layout { grid-template-columns: 1fr; } }

  /* 클래스 카드 */
  .cls-card { background: #fff; border: 1px solid #e8e8e5; border-radius: 12px; padding: 1rem; margin-bottom: 10px; }
  .cls-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .cls-name { font-size: 14px; font-weight: 600; flex: 1; border: none; border-bottom: 1.5px solid transparent; background: transparent; outline: none; color: #1a1a18; transition: border-color 0.15s; }
  .cls-name:focus { border-bottom-color: #378ADD; }
  .cls-name::placeholder { color: #bbb; font-weight: 400; }
  .cls-count { font-size: 12px; color: #888; }
  .rm-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 14px; padding: 2px 4px; border-radius: 4px; }
  .rm-btn:hover { color: #e24b4a; background: #fcebeb; }

  /* 드롭존 */
  .drop-zone { border: 1.5px dashed #d0d0cc; border-radius: 8px; min-height: 90px; display: flex; flex-direction:column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; position: relative; padding: 12px; transition: background 0.15s; }
  .drop-zone:hover { background: #f4f4f0; }
  .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-label { font-size: 12px; color: #999; text-align: center; pointer-events: none; }
  .drop-icon { font-size: 24px; color: #ccc; pointer-events: none; }

  .thumb-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .thumb-wrap { position: relative; width: 44px; height: 44px; }
  .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; border: 1px solid #e8e8e5; display: block; }
  .thumb-del { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; border-radius: 50%; background: #e24b4a; border: none; cursor: pointer; display: none; align-items: center; justify-content: center; color: #fff; font-size: 9px; line-height: 1; padding: 0; }
  .thumb-wrap:hover .thumb-del { display: flex; }
  .clear-btn { margin-top: 6px; background: none; border: none; font-size: 11px; color: #bbb; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 2px 0; }
  .clear-btn:hover { color: #e24b4a; }

  /* 클래스 추가 */
  .add-cls-btn { width: 100%; padding: 10px; border: 1.5px dashed #d0d0cc; border-radius: 12px; background: none; cursor: pointer; font-size: 13px; color: #888; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s; }
  .add-cls-btn:hover { background: #f4f4f0; }

  /* 우측 패널 */
  .right-panel { display: flex; flex-direction: column; gap: 12px; }

  /* 학습 섹션 */
  .section { background: #fff; border: 1px solid #e8e8e5; border-radius: 12px; padding: 1.25rem; }
  .section-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #1a1a18; }
  .param-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .param-label { font-size: 13px; color: #555; min-width: 40px; }
  input[type=range] { flex: 1; accent-color: #378ADD; }
  .param-val { font-size: 13px; font-weight: 600; min-width: 24px; text-align: right; color: #1a1a18; }
  .train-btn { width: 100%; padding: 10px; background: #1a1a18; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.15s; margin-top: 8px; }
  .train-btn:hover { opacity: 0.85; }
  .train-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .train-info { font-size: 12px; color: #888; margin-top: 8px; }
  .prog { height: 4px; background: #e8e8e5; border-radius: 2px; margin-top: 10px; overflow: hidden; }
  .prog-fill { height: 100%; background: #1D9E75; border-radius: 2px; transition: width 0.3s; width: 0%; }

  /* 예측 섹션 */
  .pred-drop { border: 1.5px dashed #d0d0cc; border-radius: 8px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer; position: relative; padding: 12px; transition: background 0.15s; text-align: center; }
  .pred-drop:hover { background: #f4f4f0; }
  .pred-drop input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .pred-preview { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: none; }

  .r-row { margin-bottom: 10px; }
  .r-label { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 4px; }
  .r-label .r-name { display: flex; align-items: center; gap: 6px; }
  .r-label .r-pct { font-weight: 600; color: #1a1a18; }
  .r-bar { height: 6px; background: #f0f0ec; border-radius: 3px; overflow: hidden; }
  .r-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .top-result { font-size: 13px; color: #555; margin-top: 10px; padding-top: 10px; border-top: 1px solid #e8e8e5; }
  .top-result strong { color: #1a1a18; }
  .no-train-msg { font-size: 12px; color: #bbb; text-align: center; padding: 1rem 0; }
</style>
</head>
<body>
<div class="container">
  <h1>이미지 분류기</h1>
  <p class="sub">이미지를 업로드해 각 클래스를 학습시키고, 새 이미지를 분류해 보세요</p>

  <div class="layout">
    <!-- 좌측: 클래스 정의 -->
    <div>
      <div style="font-size:13px;font-weight:600;color:#888;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">클래스 정의</div>
      <div id="cls-list"></div>
      <button class="add-cls-btn" onclick="addClass()">
        <i class="ti ti-plus"></i> 클래스 추가
      </button>
    </div>

    <!-- 우측: 학습 + 예측 -->
    <div class="right-panel">
      <div class="section">
        <div class="section-title">학습</div>
        <div class="param-row">
          <span class="param-label">에포크</span>
          <input type="range" min="1" max="50" value="20" id="epoch-slider" oninput="document.getElementById('epoch-val').textContent=this.value">
          <span class="param-val" id="epoch-val">20</span>
        </div>
        <button class="train-btn" id="train-btn" onclick="trainModel()" disabled>
          <i class="ti ti-brain"></i> 학습 시작
        </button>
        <div class="train-info" id="train-info">클래스마다 이미지를 2장 이상 추가하세요.</div>
        <div class="prog"><div class="prog-fill" id="prog-fill"></div></div>
      </div>

      <div class="section">
        <div class="section-title">예측</div>
        <div id="pred-area">
          <div class="pred-drop" id="pred-drop">
            <input type="file" accept="image/*" onchange="predictImage(this)" id="pred-input">
            <i class="ti ti-upload" style="font-size:24px;color:#ccc"></i>
            <div style="font-size:12px;color:#999">이미지를 클릭하여 업로드</div>
          </div>
          <img id="pred-img" class="pred-preview">
          <div id="pred-bars"></div>
          <div class="top-result" id="top-result" style="display:none"></div>
          <div class="no-train-msg" id="no-train-msg">학습 후 이미지를 업로드하면 분류 결과가 나타납니다.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.4/dist/knn-classifier.min.js"></script>
<script>
const COLORS = ['#378ADD','#D4537E','#1D9E75','#BA7517','#7F77DD','#D85A30'];
let classes = [];
let mnet = null, knn = null, ready = false, trained = false;

function addClass() {
  if (classes.length >= 6) return;
  const i = classes.length;
  classes.push({ id: Date.now(), name: `클래스 ${i+1}`, color: COLORS[i], images: [], tensors: [] });
  renderClasses();
}

function renderClasses() {
  const list = document.getElementById('cls-list');
  list.innerHTML = '';
  classes.forEach((cls, i) => {
    const d = document.createElement('div');
    d.className = 'cls-card';
    d.innerHTML = `
      <div class="cls-header">
        <div class="dot" style="background:${cls.color}"></div>
        <input class="cls-name" value="${cls.name}" placeholder="클래스 이름 입력" oninput="classes[${i}].name=this.value;renderBars()">
        <span class="cls-count" id="cnt-${cls.id}">${cls.images.length}장</span>
        ${classes.length > 2 ? `<button class="rm-btn" onclick="removeClass(${i})"><i class="ti ti-x"></i></button>` : ''}
      </div>
      <div class="drop-zone">
        <input type="file" accept="image/*" multiple onchange="addImages(${i},this)">
        <i class="ti ti-photo-plus drop-icon"></i>
        <div class="drop-label">클릭하여 이미지 추가<br>여러 장 선택 가능</div>
      </div>
      <div class="thumb-grid" id="thumbs-${cls.id}"></div>
      <button class="clear-btn" onclick="clearClass(${i})"><i class="ti ti-trash"></i> 초기화</button>`;
    list.appendChild(d);
    renderThumbs(i);
  });
  updateTrainBtn();
}

function renderThumbs(i) {
  const cls = classes[i];
  const el = document.getElementById(`thumbs-${cls.id}`);
  if (!el) return;
  el.innerHTML = cls.images.map((src, j) => `
    <div class="thumb-wrap">
      <img class="thumb" src="${src}">
      <button class="thumb-del" onclick="removeImage(${i},${j})" title="삭제">✕</button>
    </div>`).join('');
  const cnt = document.getElementById(`cnt-${cls.id}`);
  if (cnt) cnt.textContent = cls.images.length + '장';
}

async function addImages(i, input) {
  const cls = classes[i];
  for (const f of Array.from(input.files)) {
    const src = await readFile(f);
    cls.images.push(src);
    const img = await loadImg(src);
    cls.tensors.push(tf.browser.fromPixels(img).toFloat().expandDims(0));
  }
  renderThumbs(i);
  updateTrainBtn();
}

function removeImage(i, j) {
  const cls = classes[i];
  cls.tensors[j].dispose();
  cls.images.splice(j, 1);
  cls.tensors.splice(j, 1);
  renderThumbs(i);
  updateTrainBtn();
}

function clearClass(i) {
  const cls = classes[i];
  cls.tensors.forEach(t => t.dispose());
  cls.images = []; cls.tensors = [];
  renderThumbs(i);
  updateTrainBtn();
}

function removeClass(i) {
  classes[i].tensors.forEach(t => t.dispose());
  classes.splice(i, 1);
  renderClasses();
}

function readFile(f) {
  return new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result); r.readAsDataURL(f); });
}
function loadImg(src) {
  return new Promise(res => { const img = new Image(); img.onload = () => res(img); img.src = src; });
}

function updateTrainBtn() {
  const counts = classes.map(c => c.images.length);
  const min = Math.min(...counts);
  const ok = classes.length >= 2 && min >= 2 && ready;
  document.getElementById('train-btn').disabled = !ok;
  const info = document.getElementById('train-info');
  if (!ready) { info.textContent = '모델 로딩 중...'; return; }
  if (classes.length < 2) { info.textContent = '클래스 2개 이상 필요'; return; }
  if (min < 2) { info.textContent = `클래스마다 이미지를 2장 이상 추가하세요.`; return; }
  info.textContent = `총 ${counts.reduce((a,b)=>a+b,0)}장 준비됨`;
}

async function trainModel() {
  document.getElementById('train-btn').disabled = true;
  document.getElementById('train-info').textContent = '학습 중...';
  const fill = document.getElementById('prog-fill');
  fill.style.width = '0%';
  knn.clearAllClasses();
  let total = classes.reduce((a,c)=>a+c.tensors.length,0), done = 0;
  for (const cls of classes) {
    for (const t of cls.tensors) {
      const act = mnet.infer(t, true);
      knn.addExample(act, cls.name);
      act.dispose();
      done++;
      fill.style.width = Math.round(done/total*100) + '%';
      await tf.nextFrame();
    }
  }
  trained = true;
  document.getElementById('train-btn').disabled = false;
  document.getElementById('train-info').textContent = `학습 완료! (${total}장)`;
  document.getElementById('no-train-msg').style.display = 'none';
  renderBars();
}

function renderBars() {
  const bars = document.getElementById('pred-bars');
  bars.innerHTML = trained ? classes.map(cls => `
    <div class="r-row">
      <div class="r-label">
        <span class="r-name"><span style="width:8px;height:8px;border-radius:50%;background:${cls.color};display:inline-block"></span>${cls.name}</span>
        <span class="r-pct" id="pct-${cls.id}">—</span>
      </div>
      <div class="r-bar"><div class="r-fill" id="bar-${cls.id}" style="width:0%;background:${cls.color}"></div></div>
    </div>`).join('') : '';
}

async function predictImage(input) {
  if (!input.files[0] || !trained) return;
  const src = await readFile(input.files[0]);
  const img = document.getElementById('pred-img');
  img.src = src; img.style.display = 'block';
  const el = await loadImg(src);
  const t = tf.browser.fromPixels(el).toFloat().expandDims(0);
  const act = mnet.infer(t, true);
  const res = await knn.predictClass(act);
  t.dispose(); act.dispose();
  const probs = res.confidences;
  classes.forEach(cls => {
    const pct = Math.round((probs[cls.name]||0)*100);
    const pe = document.getElementById(`pct-${cls.id}`);
    const be = document.getElementById(`bar-${cls.id}`);
    if (pe) pe.textContent = pct + '%';
    if (be) be.style.width = pct + '%';
  });
  const top = document.getElementById('top-result');
  top.style.display = 'block';
  top.innerHTML = `분류 결과: <strong>${res.label}</strong> (${Math.round((probs[res.label]||0)*100)}% 확신)`;
  input.value = '';
}

async function init() {
  document.getElementById('train-info').textContent = '모델 로딩 중...';
  [mnet] = await Promise.all([window.mobilenet.load()]);
  knn = window.knnClassifier.create();
  ready = true;
  updateTrainBtn();
}

classes = [
  { id: 1, name: '', color: COLORS[0], images: [], tensors: [] },
  { id: 2, name: '', color: COLORS[1], images: [], tensors: [] },
];
renderClasses();
init();
</script>
</body>
</html>
