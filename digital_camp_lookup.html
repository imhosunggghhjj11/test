const DB = RAW.map(r => ({
  id: r[0],
  name: r[1],
  grade: r[0][0],
  cls: r[0][1],
  num: r[0].slice(2),
  am: r[2],
  pm: r[3]
}));

function parseClass(q) {
  q = q.replace(/\s/g,'').replace('학년','').replace('반','');
  const m1 = q.match(/^([123])-?([1-6])$/);
  if (m1) return { grade: m1[1], cls: m1[2] };
  const m2 = q.match(/^([123])([1-6])$/);
  if (m2) return { grade: m2[1], cls: m2[2] };
  if (/^[1-6]반?$/.test(q.replace('반',''))) return { cls: q.replace('반','') };
  return null;
}

function courseCourse(name) {
  const short = { '생성형AI':'생성형 AI', '머신러닝/컴퓨터비전':'머신러닝 & 컴퓨터비전', '자율주행로봇':'자율주행 로봇', '디지털포트폴리오':'디지털 포트폴리오', '마이크로비트':'마이크로비트' };
  return short[name] || name;
}

function renderStudent(s) {
  return `<div class="result-card">
    <div class="student-header">
      <div class="avatar">${s.name[0]}</div>
      <div>
        <div class="student-name">${s.name}</div>
        <div class="student-id">${s.grade}학년 ${s.cls}반 ${s.num}번 &nbsp;·&nbsp; 학번 ${s.id}</div>
      </div>
    </div>
    <div class="course-row"><span class="time-badge am-badge">오전</span><span class="course-name">${courseCourse(s.am)}</span></div>
    <div class="course-row"><span class="time-badge pm-badge">오후</span><span class="course-name">${courseCourse(s.pm)}</span></div>
  </div>`;
}

function renderClass(students, label) {
  const rows = students.sort((a,b)=>+a.num-+b.num).map(s =>
    `<tr>
      <td style="font-weight:500">${s.name}</td>
      <td style="color:var(--color-text-secondary)">${s.num}번</td>
      <td><span class="time-badge am-badge" style="font-size:11px">오전</span> ${courseCourse(s.am)}</td>
      <td><span class="time-badge pm-badge" style="font-size:11px">오후</span> ${courseCourse(s.pm)}</td>
    </tr>`
  ).join('');
  return `<div class="result-card">
    <div class="class-header">${label} <span class="class-count">총 ${students.length}명 참여</span></div>
    <table class="class-table">
      <thead><tr><th>이름</th><th>번호</th><th>오전 강좌</th><th>오후 강좌</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function search() {
  const q = document.getElementById('q').value.trim();
  const out = document.getElementById('result');
  if (!q) { out.innerHTML = ''; return; }

  const cls = parseClass(q);
  if (cls) {
    let matched = DB.filter(s => (!cls.grade || s.grade === cls.grade) && s.cls === cls.cls);
    if (!matched.length) { out.innerHTML = '<p class="empty">해당 학반 참여 학생이 없습니다.</p>'; return; }
    const label = cls.grade ? `${cls.grade}학년 ${cls.cls}반` : `전 학년 ${cls.cls}반`;
    out.innerHTML = renderClass(matched, label);
    return;
  }

  const byName = DB.filter(s => s.name.includes(q));
  if (byName.length) { out.innerHTML = byName.map(renderStudent).join(''); return; }

  out.innerHTML = '<p class="empty">검색 결과가 없습니다. 이름(2자 이상) 또는 학반(예: 1-3, 2반)을 입력해 주세요.</p>';
}

document.getElementById('q').addEventListener('keydown', e => { if (e.key==='Enter') search(); });

const tags = document.getElementById('tags');
['1학년','2학년','3학년'].forEach(g => {
  [1,2,3,4,5,6].forEach(c => {
    const grade = g[0];
    const count = DB.filter(s => s.grade===grade && s.cls===String(c)).length;
    if (!count) return;
    const t = document.createElement('span');
    t.className = 'tag';
    t.textContent = `${g} ${c}반 (${count}명)`;
    t.onclick = () => { document.getElementById('q').value=`${grade}-${c}`; search(); };
    tags.appendChild(t);
  });
});
